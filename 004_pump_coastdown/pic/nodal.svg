<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450">
  <title>Нодализация отдельного стенда для исследования выбега насоса</title>
  <desc>Два граничных объема с одинаковым давлением соединены каналом. Насос связан с ячейкой канала, сопротивление расположено после насоса.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#155e75"/></marker></defs>
  <rect width="1100" height="450" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b3a">
    <text x="40" y="43" font-size="26" font-weight="bold">004 · Характеристика и выбег насоса</text>
    <text x="40" y="76" font-size="18">Учебный стенд · однофазная вода · горизонтальная ветвь</text>
    <g fill="#e0f2fe" stroke="#155e75" stroke-width="2">
      <rect x="40" y="180" width="150" height="100" rx="8"/>
      <rect x="250" y="203" width="150" height="54"/>
      <rect x="400" y="203" width="190" height="54" fill="#a5e1ed"/>
      <rect x="590" y="203" width="130" height="54"/>
      <rect x="910" y="180" width="150" height="100" rx="8"/>
    </g>
    <g stroke="#155e75" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M190 230H245"/><path d="M720 230H760"/><path d="M850 230H905"/>
      <path d="M270 171H700"/>
    </g>
    <path d="M765 208L807 230L765 252ZM849 208L807 230L849 252Z" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <circle cx="495" cy="125" r="36" fill="#fff" stroke="#155e75" stroke-width="3"/>
    <path d="M480 108L519 125L480 142Z" fill="#155e75"/>
    <path d="M495 161V203" stroke="#155e75" stroke-width="2" stroke-dasharray="5 4"/>
    <g font-size="18" text-anchor="middle">
      <text x="115" y="216" font-weight="bold">BVOL_T</text><text x="115" y="246">p, T входа</text>
      <text x="325" y="236">CH · подвод</text><text x="495" y="236">Ячейка насоса</text><text x="655" y="236">CH · отвод</text>
      <text x="985" y="216" font-weight="bold">BVOL_T</text><text x="985" y="246">то же p</text>
      <text x="807" y="287">Сопротивление</text><text x="350" y="157">Q &gt; 0</text>
    </g>
    <text x="550" y="123" font-size="19" font-weight="bold">CPUMP · MODE=0</text>
    <text x="550" y="149" font-size="17">OR=0 · связь с ячейкой CH</text>
    <path d="M590 257V290" stroke="#b45309" stroke-width="2"/>
    <text x="420" y="318" font-size="17" fill="#92400e">Напор добавляется в выходном соединении ячейки</text>
    <rect x="40" y="350" width="1020" height="68" rx="8" fill="#e2e8f0"/>
    <text x="60" y="377" font-size="18">До отключения: установившийся режим с приводным моментом HMOM.</text>
    <text x="60" y="403" font-size="18">После t₀: HMOM = 0; обороты рассчитываются по уравнению ротора, J сохраняется.</text>
  </g>
</svg>
