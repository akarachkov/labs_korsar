<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510">
  <title>Прямоточная схема теплообменника из двух CH и одной HCS</title>
  <desc>Горячий и холодный потоки направлены слева направо; одноименные ячейки связаны через внутреннюю и наружную поверхности трубной стенки.</desc>
  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b91c1c"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0369a1"/></marker>
    <marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a16207"/></marker>
  </defs>
  <rect width="1100" height="510" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b3a">
    <text x="40" y="43" font-size="26" font-weight="bold">005 · Прямоточный кожухотрубный теплообменник</text>
    <text x="40" y="76" font-size="18">Схема тепловых связей · оба потока движутся от x = 0 к x = L</text>
    <g stroke-width="2">
      <rect x="245" y="140" width="610" height="60" fill="#fee2e2" stroke="#b91c1c"/>
      <rect x="245" y="244" width="610" height="50" fill="#fef3c7" stroke="#a16207"/>
      <rect x="245" y="337" width="610" height="60" fill="#e0f2fe" stroke="#0369a1"/>
      <path d="M397 140V397M550 140V397M703 140V397" stroke="#94a3b8" stroke-dasharray="5 5"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="321" y="178">CH1(1)</text><text x="473" y="178">CH1(2)</text><text x="626" y="178">…</text><text x="779" y="178">CH1(N)</text>
      <text x="321" y="276">HCS1(1)</text><text x="473" y="276">HCS1(2)</text><text x="626" y="276">…</text><text x="779" y="276">HCS1(N)</text>
      <text x="321" y="375">CH2(1)</text><text x="473" y="375">CH2(2)</text><text x="626" y="375">…</text><text x="779" y="375">CH2(N)</text>
    </g>
    <g stroke="#a16207" stroke-width="2" marker-end="url(#heat)">
      <path d="M321 205V239"/><path d="M473 205V239"/><path d="M779 205V239"/>
      <path d="M321 299V331"/><path d="M473 299V331"/><path d="M779 299V331"/>
    </g>
    <g font-size="17">
      <text x="38" y="146" fill="#991b1b">Горячая вода</text><text x="38" y="172">ṁₕ, Tₕ,in</text>
      <text x="38" y="345" fill="#075985">Холодная вода</text><text x="38" y="373">ṁc, Tc,in</text>
      <text x="878" y="146">Tₕ,out · p выхода</text><text x="878" y="345">Tc,out · p выхода</text>
      <text x="873" y="226">/1 · внутри труб</text><text x="873" y="319">/2 · снаружи труб</text>
    </g>
    <g stroke-width="3" fill="none">
      <path d="M45 191H234M865 191H1050" stroke="#b91c1c" marker-end="url(#red)"/>
      <path d="M45 390H234M865 390H1050" stroke="#0369a1" marker-end="url(#blue)"/>
    </g>
    <text x="245" y="122" font-size="17">x = 0</text><text x="808" y="122" font-size="17">x = L</text>
    <rect x="40" y="433" width="1020" height="52" rx="8" fill="#e2e8f0"/>
    <text x="58" y="465" font-size="18">HCS: цилиндрическая стенка; B = число труб. При сгущении сетки длина и площади сохраняются.</text>
  </g>
</svg>
