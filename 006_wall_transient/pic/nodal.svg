<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>Лабораторная работа 006: плоская стенка HCS с двумя BHEAT</title>
<desc>Слева температура скачком возрастает от T0 до Tb. Справа температура T0 для варианта A или теплоизоляция для варианта B. Узлы HCS расположены по толщине от нуля до L.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0e7490"/></marker></defs>
<rect width="1100" height="520" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#183141">
<text x="40" y="42" font-size="26" font-weight="bold">006 · Нестационарная теплопроводность</text>
<text x="40" y="74" font-size="18">Одна плоская HCS · две поверхности · разбиение по толщине</text>
<rect x="370" y="130" width="350" height="200" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<g stroke="#b45309" stroke-dasharray="5 5"><path d="M414 130V330M458 130V330M502 130V330M546 130V330M590 130V330M634 130V330M678 130V330"/></g>
<rect x="40" y="182" width="235" height="112" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="805" y="160" width="255" height="158" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<g font-size="19" text-anchor="middle">
<text x="157" y="212" font-weight="bold">BHEAT1 · TYPE=1</text><text x="157" y="243">T₀ → Tb при τ = τₛ</text><text x="157" y="272">Температурный скачок</text>
<text x="933" y="190" font-weight="bold">BHEAT2</text><text x="933" y="224">A: TYPE=1, T = T₀</text><text x="933" y="260">B: TYPE=2, q = 0</text><text x="933" y="294">Теплоизоляция для B</text>
<text x="546" y="116" font-weight="bold">HCS1 · COOR=0</text>
<rect x="445" y="208" width="202" height="45" fill="#fef3c7" stroke="none"/>
<text x="546" y="237">N=1 · KL=1 · K узлов</text>
<text x="370" y="357">/1 · x=0</text><text x="720" y="357">/2 · x=L</text>
</g>
<g stroke="#0e7490" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M275 238H365"/><path d="M725 238H800"/><path d="M370 392H720"/></g>
<text x="286" y="218" font-size="18">q₀</text><text x="749" y="218" font-size="18">qL</text>
<text x="447" y="420" font-size="18">+x · полная толщина L</text>
<rect x="40" y="448" width="1020" height="46" rx="8" fill="#e2e8f0"/>
<text x="60" y="477" font-size="18">До скачка: T(x) = T₀. Потоки после скачка восстанавливаются по градиенту узловых температур.</text>
</g></svg>
